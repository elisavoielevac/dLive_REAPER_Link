<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dLive_REAPER_Link</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>dLive &rarr; REAPER Link</h1>
      <p>Setup complete</p>
      <div class="reaper-osc-settings">
        <label for="reaper-osc-host">REAPER OSC Host</label>
        <input id="reaper-osc-host" type="text" autocomplete="off" spellcheck="false" />
        <label for="reaper-osc-port">REAPER OSC Port</label>
        <input id="reaper-osc-port" type="number" min="1" max="65535" inputmode="numeric" />
        <button id="save-reaper-osc-settings" type="button">Save REAPER OSC Settings</button>
      </div>
      <p id="reaper-osc-settings-result" role="status" aria-live="polite"></p>
      <button id="list-midi-inputs" type="button">Refresh MIDI Inputs</button>
      <p id="midi-inputs-result" role="status" aria-live="polite"></p>
      <div class="scene-file-actions">
        <p id="scene-file-path" role="status" aria-live="polite"></p>
        <button id="reveal-scene-file" type="button">Reveal Scene File</button>
        <button id="reload-scene-names" type="button">Reload Scene Names</button>
      </div>
      <p id="scene-file-reveal-result" role="status" aria-live="polite"></p>
      <p id="scene-file-reload-result" role="status" aria-live="polite"></p>
      <label for="midi-input-select">MIDI input</label>
      <select id="midi-input-select" disabled>
        <option value="">List MIDI inputs first</option>
      </select>
      <button id="start-midi-log" type="button" disabled>Start dLive Link</button>
      <button id="stop-midi-log" type="button" disabled>Stop dLive Link</button>
      <p id="midi-log-result" role="status" aria-live="polite"></p>
      <p id="midi-scene-result" role="status" aria-live="polite"></p>
      <p id="midi-scene-name-result" role="status" aria-live="polite"></p>
      <h2 id="midi-activity-heading">MIDI Activity</h2>
      <pre id="midi-log" aria-live="polite" aria-labelledby="midi-activity-heading"></pre>
    </main>
  </body>
</html>
