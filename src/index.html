<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dLive_REAPER_Link</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>dLive &rarr; REAPER Link</h1>
      <p>Setup complete</p>
      <button id="test-reaper-osc" type="button">Test REAPER OSC</button>
      <p id="test-reaper-osc-result" role="status" aria-live="polite"></p>
      <button id="list-midi-inputs" type="button">List MIDI Inputs</button>
      <p id="midi-inputs-result" role="status" aria-live="polite"></p>
      <label for="midi-input-select">MIDI input</label>
      <select id="midi-input-select" disabled>
        <option value="">List MIDI inputs first</option>
      </select>
      <button id="start-midi-log" type="button" disabled>Start MIDI Log</button>
      <p id="midi-log-result" role="status" aria-live="polite"></p>
      <p id="midi-scene-result" role="status" aria-live="polite"></p>
      <p id="midi-scene-name-result" role="status" aria-live="polite"></p>
      <pre id="midi-log" aria-live="polite"></pre>
    </main>
  </body>
</html>
